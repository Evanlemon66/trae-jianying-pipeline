<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>剪映工作流 Console</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M12 9l11 7-11 7z' fill='white'/%3E%3C/svg%3E">
  <script>
    /* 首屏应用已保存的主题，避免闪烁（不连外网） */
    try {
      var t = localStorage.getItem("jy-console-theme");
      if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.6v12.8a1 1 0 0 0 1.53.85l9.8-6.4a1 1 0 0 0 0-1.7l-9.8-6.4A1 1 0 0 0 8 5.6z"/></svg>
        </span>
        <span class="brand-text">
          <strong>剪映工作流</strong>
          <small>本地 Console</small>
        </span>
      </div>

      <nav class="nav" aria-label="主导航">
        <button class="nav-item active" data-page="run">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-13a1 1 0 0 1 1-1z"/><path d="M8 9h8M8 13h5"/></svg>
          <span>任务</span>
        </button>
        <button class="nav-item" data-page="env">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7l8-4 8 4-8 4-8-4z"/><path d="M4 12l8 4 8-4M4 17l8 4 8-4"/></svg>
          <span>环境初始化</span>
        </button>
        <button class="nav-item" data-page="archive">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h16v11.5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8z"/><path d="M3 4h18v4H3z"/><path d="M10 12h4"/></svg>
          <span>归档清理</span>
        </button>
        <button class="nav-item" data-page="history">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
          <span>历史</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换深浅主题">
          <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
          <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/></svg>
          <span id="theme-label">浅色</span>
        </button>
        <p class="foot-note">仅 127.0.0.1 · 零依赖</p>
      </div>
    </aside>

    <div class="workspace">
      <header class="statusbar">
        <button class="sb-item sb-link" type="button" data-goto="env-service"
                title="查看 Console 服务与登录自启">
          <span class="sb-k">服务</span>
          <span class="sb-v" id="sb-service"><i class="dot pending"></i>连接中</span>
        </button>
        <div class="sb-sep" aria-hidden="true"></div>
        <button class="sb-item sb-link" type="button" data-goto="run"
                title="查看当前任务与实时状态">
          <span class="sb-k">当前任务</span>
          <span class="sb-v" id="sb-task">空闲</span>
        </button>
        <div class="sb-sep" aria-hidden="true"></div>
        <button class="sb-item sb-link" type="button" data-goto="run"
                title="导出锁由串流任务独占；点击查看任务页">
          <span class="sb-k">导出锁</span>
          <span class="sb-v" id="sb-lock"><i class="dot pending"></i>读取中</span>
        </button>
        <div class="sb-spacer"></div>
        <div class="sb-item sb-time">
          <span class="sb-k">更新</span>
          <span class="sb-v mono" id="sb-time">--:--:--</span>
        </div>
      </header>

      <main class="content">
        <section id="page-run" class="page active"></section>
        <section id="page-env" class="page"></section>
        <section id="page-archive" class="page"></section>
        <section id="page-history" class="page"></section>
      </main>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <span class="toast-ico" aria-hidden="true"></span>
    <span id="toast-msg"></span>
  </div>

  <script src="/static/api.js"></script>
  <script src="/static/dialog.js"></script>
  <script src="/static/view.js"></script>
  <script src="/static/env.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
